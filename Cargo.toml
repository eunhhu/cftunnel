[package]
name = "cftunnel"
version = "0.2.0"
edition = "2024"
authors = ["eunhhu"]
description = "Cloudflare Tunnel configuration management TUI"
license = "MIT"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"

# Date/Time
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
